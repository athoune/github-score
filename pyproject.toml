[project]
name = "gh-score"
version = "0.10.0"
description = "GitHub Project Health Scorer - evaluate maturity, maintenance, community health and sustainability"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["github", "health", "maintenance", "scoring", "audit", "sustainability"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
authors = [
    { name = "Mathieu Lecarme", email = "mathieu@garambrogne.net" }
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "platformdirs>=4.0",
    "gitpython>=3.1.57",
]

[project.scripts]
gh-score = "gh_score.cli.main:cli"

[project.urls]
Homepage = "https://github.com/athoune/github-score"
Repository = "https://github.com/athoune/github-score"
Issues = "https://github.com/athoune/github-score/issues"

[build-system]
requires = ["uv_build>=0.11.31,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[tool.prospector]
# Ignore mccabe complexity warnings
disable = ["MC0001"]

[tool.pylint]
# Ignore import errors for optional dependencies
ignored-modules = ["git"]

[tool.pytest.ini_options]
markers = [
    "llm: functional tests that call a real LLM (skipped unless GH_SCORE_LLM_ENABLED)",
]
