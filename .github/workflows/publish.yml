name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    # GitHub Actions does not allow secrets inside `if:` conditions. The
    # token is exposed as a job-level env var (empty when the secret does
    # not exist) so the publish steps below can branch on it.
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes only full tags (v9.0.0), no major-only "v9".
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Check version matches the tag
        # uv build derives the artifact name from pyproject.toml, so a tag
        # pointing at a commit whose version was not bumped would build an
        # already-published file and fail with a cryptic PyPI "400 file
        # already exists". Fail fast with the real reason instead.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match pyproject.toml version ${PROJECT_VERSION} — bump the version first"
            exit 1
          fi

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Build distributions
        run: uv build

      # Publish via an API token when the PYPI_TOKEN secret exists…
      - name: Publish to PyPI (API token)
        if: ${{ env.PYPI_TOKEN != '' }}
        env:
          UV_PUBLISH_TOKEN: ${{ env.PYPI_TOKEN }}
        run: uv publish

      # …otherwise rely on trusted publishing (OIDC). This requires the
      # "pypi" environment in the repo settings and the GitHub repository
      # configured as a trusted publisher in the PyPI project settings.
      - name: Publish to PyPI (trusted publishing)
        if: ${{ env.PYPI_TOKEN == '' }}
        run: uv publish
