[project]
name = "gh-score"
version = "0.1.0"
description = "GitHub Project Health Scorer - evaluate maturity, maintenance, community health and sustainability"
readme = "README.md"
authors = [
    { name = "Mathieu Lecarme", email = "mathieu@garambrogne.net" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
    "click>=8.1",
    "platformdirs>=4.0",
    "gitpython>=3.1.57",
]

[project.scripts]
gh-score = "gh_score.cli.main:cli"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[tool.prospector]
# Ignore mccabe complexity warnings
disable = ["MC0001"]

[tool.pylint]
# Ignore import errors for optional dependencies
ignored-modules = ["git"]
