name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run every supported interpreter even if one fails: the matrix is the
      # point, a single-version failure must not mask the others.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # setup-uv publishes only full tags (v9.0.0), no major-only "v9".
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        # Functional LLM tests are skipped automatically when
        # GH_SCORE_LLM_ENABLED is not set.
        run: uv run pytest tests/ -q
